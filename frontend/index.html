<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tech Product Showcase</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 0; background: #f4f6fb; color: #1f2937; }
    header { background: #1e3a8a; color: #fff; padding: 20px 24px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header p { margin: 4px 0 0; opacity: .8; font-size: .9rem; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2 { margin-top: 0; font-size: 1.1rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; font-size: .8rem; font-weight: 600; gap: 4px; }
    input, textarea { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    textarea { resize: vertical; min-height: 38px; }
    .full { grid-column: 1 / -1; }
    .actions { display: flex; gap: 8px; }
    button { border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
    .primary { background: #1e3a8a; color: #fff; }
    .secondary { background: #e2e8f0; }
    .edit { background: #f59e0b; color: #fff; }
    .del { background: #dc2626; color: #fff; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { background: #f1f5f9; }
    #message { padding: 10px 14px; border-radius: 6px; display: none; font-size: .9rem; }
    #message.ok { display: block; background: #dcfce7; color: #166534; }
    #message.err { display: block; background: #fee2e2; color: #991b1b; }
    td.row-actions { white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Tech Product Showcase</h1>
    <p>Single-table CRUD app &middot; Node.js + Express + SQLite</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add a new product</h2>
      <div id="message"></div>
      <form id="product-form">
        <input type="hidden" id="id" />
        <label>Product name *<input id="product_name" required maxlength="150" /></label>
        <label>Brand *<input id="brand" required maxlength="80" /></label>
        <label>Category *<input id="category" required maxlength="60" placeholder="Laptop, Audio..." /></label>
        <label>Price ($) *<input id="price" type="number" step="0.01" min="0" required /></label>
        <label>Stock quantity *<input id="stock_quantity" type="number" min="0" step="1" required /></label>
        <label>Rating (0-5)<input id="rating" type="number" min="0" max="5" step="0.1" /></label>
        <label class="full">Description<textarea id="description"></textarea></label>
        <div class="actions full">
          <button type="submit" class="primary" id="save-btn">Add product</button>
          <button type="button" class="secondary" id="cancel-btn" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Products (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Description</th><th>Updated</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
